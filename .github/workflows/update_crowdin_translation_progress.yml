name: Update Crowdin translation badge

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # V7.0.1

      - uses: SeaweedbrainCY/crowdin-translation-progress@da59a487e69b937b89863826aa3fcf4a8b12aa4c
        with:
          crowdin_token: ${{ secrets.CROWDIN_TOKEN }}
          crowdin_project_id: ${{ secrets.CROWDIN_PROJECT_ID }}
          output_path: assets/crowdin-status.svg

      - name: Commit if changed
        run: |
          git add assets/crowdin-status.svg
          if git diff  --cached --quiet; then
            echo "No change in translation progress, skipping commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update Crowdin translation status badge"
          git push
