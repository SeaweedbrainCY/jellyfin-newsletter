name: GO code testing and, security and quality scanning

on:
  workflow_call:
  push:
    branches:
      - "*"
      - "**"
      - "*/*"
      - "**/**"
  pull_request:

jobs:
  semgrep_scan:
    permissions:
      contents: read
    name: Semgrep scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./engine-go
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install semgrep
        run: python3 -m pip install semgrep

      - name: Run semgrep
        run: semgrep scan --error

  golangci:
    name: Go lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11
          working-directory: ./engine-go

  go_test:
    name: "Go test"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 10
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
      - uses: gwatts/go-coverage-action@2845595538a59d63d1bf55f109c14e104c6f7cb3 # v2.0.0
        name: "Run go test and generate coverage report"
        env:
          INTEGRATION_TEST_CONFIG_FILE: ../../testdata/fixtures/config/config.test.yml
        with:
          working-directory: ./engine-go
          cover-pkg: ./...
          test-args: '["-tags=integration"]'

  go_vulncheck:
    name: "Go vulncheck"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - id: govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          work-dir: engine-go/

  poutine:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: poutine - GitHub Actions SAST
        uses: boostsecurityio/poutine-action@e240ebd3eff8b2db5a8e5f6b28f58739d7db2247 # v1.1.4

      - name: Upload poutine SARIF file
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 #v4.38
        with:
          sarif_file: results.sarif
